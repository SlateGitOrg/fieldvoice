[project]
name = "fieldvoice"
version = "0.1.0"
description = "Offline speech-to-structured field reports evaluated on entity error rate, not word error rate - because only the part numbers matter."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
